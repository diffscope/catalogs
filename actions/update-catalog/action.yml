name: Update Catalog
description: Submit a product release manifest and wait for the catalog update.

inputs:
  product:
    description: Product directory under v1.
    required: true
  channel:
    description: Release channel (stable, beta, or nightly).
    required: true
  manifest:
    description: Complete version manifest encoded as JSON.
    required: true
  app-id:
    description: GitHub App ID with Actions write permission on diffscope/catalogs.
    required: false
  private-key:
    description: GitHub App private key.
    required: false
  token:
    description: Token with Actions write permission on diffscope/catalogs. Defaults to github.token for same-repository callers without App credentials.
    required: false

runs:
  using: composite
  steps:
    - name: Validate dispatch authentication
      shell: bash
      env:
        CATALOG_TOKEN: ${{ inputs.token }}
        CATALOG_APP_ID: ${{ inputs.app-id }}
        CATALOG_PRIVATE_KEY: ${{ inputs.private-key }}
        CATALOG_CALLER: ${{ github.repository }}
      run: |
        if [[ -n "$CATALOG_TOKEN" ]]; then
          exit 0
        fi
        if [[ -n "$CATALOG_APP_ID" || -n "$CATALOG_PRIVATE_KEY" ]]; then
          if [[ -z "$CATALOG_APP_ID" || -z "$CATALOG_PRIVATE_KEY" ]]; then
            echo 'Both app-id and private-key are required when using a GitHub App' >&2
            exit 1
          fi
        elif [[ "$CATALOG_CALLER" != diffscope/catalogs ]]; then
          echo 'Cross-repository callers must supply a token or GitHub App credentials' >&2
          exit 1
        fi
    - name: Create catalogs dispatch token
      id: app-token
      if: inputs.token == '' && inputs.app-id != ''
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: diffscope
        repositories: catalogs
        permission-actions: write
    - name: Update catalogs and wait for completion
      uses: actions/github-script@v7
      env:
        CATALOG_ACTION_PATH: ${{ github.action_path }}
        CATALOG_PRODUCT: ${{ inputs.product }}
        CATALOG_CHANNEL: ${{ inputs.channel }}
        CATALOG_MANIFEST: ${{ inputs.manifest }}
      with:
        github-token: ${{ inputs.token || steps.app-token.outputs.token || github.token }}
        script: |
          await require(process.env.CATALOG_ACTION_PATH + '/dispatch.cjs')({github, core});
