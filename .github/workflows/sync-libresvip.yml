name: Sync LibreSVIP Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  check:
    name: Check for new release
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.check.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream release
        id: check
        run: |
          $headers = @{ 'User-Agent' = 'SyncLibreSVIP' }
          $releases = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/SoulMelody/LibreSVIP/releases?per_page=100'
          $all = @($releases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' } | ForEach-Object { $_.tag_name -replace '^v', '' })
          if ($all.Count -eq 0) { Write-Error 'No matching release found upstream'; exit 1 }
          $index = Get-Content 'v1/libresvip-cli/index.json' -Raw | ConvertFrom-Json
          $current = ($index.stable.versions | ForEach-Object { [version]$_.version } | Measure-Object -Maximum).Maximum
          $new = @($all | Where-Object { [version]$_ -gt $current } | Sort-Object { [version]$_ } -Descending)
          if ($new.Count -gt 0) {
            "versions=$($new | ConvertTo-Json -Compress -AsArray)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "New versions found: $($new -join ', ') (current: $current)"
          } else {
            'versions=[]' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "No new version (current: $current)"
          }

  verify:
    name: Verify on ${{ matrix.os }}
    needs: check
    if: needs.check.outputs.versions != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            ext: tar.gz
            exe: libresvip-cli
          - os: macos-latest
            artifact: macos-arm64
            ext: tar.gz
            exe: libresvip-cli
    steps:
      - name: Download and verify CLI
        run: |
          $versions = '${{ needs.check.outputs.versions }}' | ConvertFrom-Json
          foreach ($version in $versions) {
            $dir = "libresvip-$version"
            $url = "https://github.com/SoulMelody/LibreSVIP/releases/download/v$version/LibreSVIP-CLI-$version.${{ matrix.artifact }}.${{ matrix.ext }}"
            $archive = "libresvip-$version.${{ matrix.ext }}"
            Invoke-WebRequest -Uri $url -OutFile $archive
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            if ('${{ matrix.ext }}' -eq 'zip') {
              Expand-Archive -Path $archive -DestinationPath $dir -Force
            } else {
              tar -xzf $archive -C $dir
            }
            $cliPath = "$dir/libresvip-cli/${{ matrix.exe }}"
            if (-not (Test-Path -LiteralPath $cliPath)) { Write-Error "CLI binary not found at $cliPath"; exit 1 }
            if (-not $IsWindows) { & chmod +x $cliPath }
            $output = (& $cliPath plugin list 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { Write-Error "libresvip-cli plugin list failed for v$version (exit $LASTEXITCODE):`n$output"; exit 1 }
            if ($output -notmatch 'dspx') { Write-Error "plugin list for v$version does not contain dspx:`n$output"; exit 1 }
            Write-Host "OK: v$version on ${{ runner.os }} contains dspx plugin"
          }

  update:
    name: Update stable catalog for ${{ matrix.version }}
    needs: [check, verify]
    if: needs.check.outputs.versions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJSON(needs.check.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build stable release manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          LIBRESVIP_VERSION: ${{ matrix.version }}
        run: |
          python .github/scripts/libresvip.py $env:LIBRESVIP_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Update catalog and wait for completion
        uses: ./actions/update-catalog
        with:
          product: libresvip-cli
          channel: stable
          manifest: ${{ steps.manifest.outputs.manifest }}
